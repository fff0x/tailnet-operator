---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Organisation-free. Override the namespace, the image (both operator and OPERATOR_IMAGE) and add a
# NetworkPolicy for the operator egress in your own overlay — the operator needs kube-apiserver, DNS
# and the Headscale API, which is only cleanly expressible per CNI.
resources:
  - crds/tailnet.this-is-fine.io_tailnets.yaml
  - crds/tailnet.this-is-fine.io_tailnetegresses.yaml
  - crds/tailnet.this-is-fine.io_tailnetingresses.yaml
  - rbac.yaml
  - operator.yaml
  - servicemonitor.yaml
