---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# operator.yaml is generated by task deploy-gen from the chart's default values.
# Optional monitoring and NetworkPolicy resources are configured through Helm values.
# Keep examples separate: this bundle never creates Tailnet CRs or credentials.
resources:
  - crds/tailnet.this-is-fine.io_tailnets.yaml
  - crds/tailnet.this-is-fine.io_tailnetegresses.yaml
  - crds/tailnet.this-is-fine.io_tailnetingresses.yaml
  - operator.yaml
