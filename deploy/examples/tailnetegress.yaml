---
# One egress identity in the operator's namespace; consumerNamespaces
# decides who may reach its Services. The tag needs tagOwners, a /32
# route approval and a grant per target: with Tailnet.spec.policy the
# operator generates them, otherwise an admin writes them and the
# operator only reports what is missing. Each target becomes a Service
# named after it: <target>.<operator-namespace>:<port>.
apiVersion: tsunaro.io/v1alpha1
kind: TailnetEgress
metadata:
  name: billing-dev
  namespace: tailnet-system
spec:
  tailnetRef:
    name: corp
  # tag: tag:ns-billing-dev      # default: tag:egress-{name}
  # hostname: egress-billing-dev # default: egress-{name}
  consumerNamespaces:
    - billing-dev
  targets:
    - name: oracle-db-1
      address: 10.0.10.20
      port: 1521
    - name: oracle-db-2
      address: 10.0.10.21
      port: 1521
    - name: broker-1
      address: 10.0.20.10
      port: 5672
    # A target routed by name (TLS SNI / HTTP Host) behind a reverse
    # proxy at the far site: consumers must dial the real hostname, so
    # publish it as an alias of the Service ClusterIP via
    # Tailnet.spec.dns.hostsConfigMap. The L4 tunnel passes SNI through.
    - name: api-corp
      address: 10.0.30.10
      port: 443
      aliases:
        - api.corp.example
