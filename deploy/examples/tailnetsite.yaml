---
# A remote network a tagged subnet router advertises into the tailnet:
# a branch (/24), a management range or a single host (/32).
# Cluster-scoped, in the cluster whose operator owns the policy (mode
# Apply). The operator appends autoApprovers for the prefixes, replays
# the approval on every node carrying an advertiser tag — in this or
# another cluster — and reports
# Advertised/Approved/Ready. Who may reach the prefixes is a grant in
# the base policy or a TailnetGrant. Overlap with Tailnet.spec.reservedNetworks or an
# older TailnetSite blocks the CR (RouteConflict) until resolved.
# docs/how-to/site-network.md: a branch behind a tagged router you run and
# the prod-1 LAN behind the operator-managed gateway
# (deploy/examples/tailnetgateway.yaml) are declared the same way.
apiVersion: tsunaro.io/v1alpha1
kind: TailnetSite
metadata:
  name: branch-north
spec:
  tailnetRef:
    name: corp
  prefixes:
    - 203.0.113.0/24
    - 198.18.0.17/32
  # Routers allowed to advertise these prefixes. Omit to use
  # Tailnet.spec.policy.routeApprovers (the gateway's tag).
  advertisedBy:
    tags: [tag:fabric]
  owner: netops
  description: Branch office north, reached through the on-prem subnet router
