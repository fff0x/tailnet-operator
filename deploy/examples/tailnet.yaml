---
# A control server the cluster talks to. Cluster-scoped: one per Headscale, shared by every
# TailnetEgress. The bootstrap API key is read-only; the operator mints and rotates its own working
# key from it into <name>-apikey, which is not managed by GitOps.
apiVersion: tailnet.fr0st.dev/v1alpha1
kind: Tailnet
metadata:
  name: corp
spec:
  server: https://ts.example.com
  # In-cluster REST endpoint if it differs from the public login URL.
  apiUrl: http://headscale.tailnet-system.svc:8080
  apiSecretRef:
    name: headscale-bootstrap
    key: apiKey
  # apiKeyLifetime: 720h   # working key, rotated at half-life
  # authKeyLifetime: 168h  # per-CR pre-auth key, rotated at half-life
  proxy:
    mtu: 1200
    probeInterval: 5m
  # DNS names (optional). The operator renders a CoreDNS `hosts` file into this ConfigMap (operator
  # namespace, key "hosts"): every TailnetEgress target alias -> its Service ClusterIP, every
  # TailnetIngress dnsName -> the node's tailnet IPs. Mount it into a resolver that is authoritative
  # for the zones (README "DNS names"). Keep the ingress name ONE label below your gateway's
  # wildcard certificate, e.g. *.prod-1.tailnet.example.internal.
  dns:
    hostsConfigMap: tailnet-dns-hosts
    ingressNameTemplate: "{name}-{namespace}.prod-1.tailnet.example.internal"
