---
# One ingress identity. Lives in the tenant namespace and exposes in-cluster Services on the tailnet
# as a single userspace node with a MagicDNS name (here: ingress-shop). Each expose is a plain-TCP
# listener on the node — L4, any protocol — forwarded to a Service in this same namespace. The tag
# must already be declared in the tailnet policy WITH grants whose dst is the tag (they decide which
# peers may reach it); the operator reports a missing grant, it never writes policy. A tailnet peer
# then dials e.g. ingress-shop:5432 (node MagicDNS name + the expose port).
apiVersion: tailnet.fr0st.dev/v1alpha1
kind: TailnetIngress
metadata:
  name: shop
  namespace: shop-dev
spec:
  tailnetRef:
    name: corp
  # tag: tag:ingress-shop      # default: tag:ingress-{name} from the Tailnet template
  # hostname: ingress-shop     # default: ingress-{name} (the node's MagicDNS label)
  exposes:
    - name: postgres
      port: 5432               # port the tailnet node listens on
      backend:
        service: shop-db-rw    # Service in this namespace
        port: 5432
    - name: redis
      port: 6379
      backend:
        service: shop-redis
        port: 6379
    # HTTPS funnel: TLS still terminates at the shared Envoy gateway (wildcard cert, HTTPRoute by
    # Host), but the tailnet identity — and therefore the policy grant — is this app's own node.
    # Requires Tailnet.spec.dns.ingressNameTemplate; the rendered status.dnsName resolves to this
    # node and is the hostname the tenant puts on its HTTPRoute.
    # - name: https
    #   port: 443
    #   backend:
    #     service: envoy-prod-1-tailnet
    #     namespace: envoy-gateway-system   # cross-namespace backend
    #     port: 443
