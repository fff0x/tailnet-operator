---
# One ingress identity in the tenant namespace: a single userspace node
# (MagicDNS name ingress-shop) exposing in-cluster Services on the
# tailnet. Each expose is a plain-TCP listener (L4, any protocol)
# forwarded to a Service in this namespace. Who may reach it is a
# policy grant with dst = the tag: with Tailnet.spec.policy the operator
# generates it from allowFrom (each entry must match the admin's
# ingressSourceAllowlist, else PolicyDenied); otherwise an admin writes
# tag and grant and the operator only reports what is missing.
# A tailnet peer then dials e.g. ingress-shop:5432.
apiVersion: tsunaro.io/v1alpha1
kind: TailnetIngress
metadata:
  name: shop
  namespace: shop-dev
spec:
  tailnetRef:
    name: corp
  # tag: tag:ingress-shop      # default: tag:ingress-{name}
  # hostname: ingress-shop     # default: ingress-{name}
  allowFrom: [group:shop]      # grant src (operator-owned policy only)
  exposes:
    - name: postgres
      port: 5432               # port the tailnet node listens on
      backend:
        service: shop-db-rw    # Service in this namespace
        port: 5432
    - name: redis
      port: 6379
      backend:
        service: shop-redis
        port: 6379
    # HTTPS funnel: TLS still terminates at the shared Envoy gateway
    # (wildcard cert, HTTPRoute by Host), but the tailnet identity — and
    # so the grant — is this app's own node. Needs
    # Tailnet.spec.dns.ingressNameTemplate; status.dnsName resolves to
    # this node and is the hostname the tenant puts on its HTTPRoute.
    # - name: https
    #   port: 443
    #   backend:
    #     service: envoy-prod-1-tailnet
    #     namespace: envoy-gateway-system   # cross-namespace backend
    #     port: 443
