              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TailnetSpec describes a control server and how the operator
              authenticates to it.
            properties:
              apiKeyLifetime:
                default: 720h
                description: Lifetime of the self-minted working API key. Rotated
                  at half-life.
                type: string
              apiSecretRef:
                description: |-
                  Bootstrap API key, read only. The operator mints its own rotating working key from it and
