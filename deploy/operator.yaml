---
apiVersion: v1
kind: Namespace
metadata:
  name: tailnet-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tailnet-operator
  namespace: tailnet-system
  labels:
    app.kubernetes.io/name: tailnet-operator
spec:
  # One replica. The agent Deployments use Recreate and the operator holds no lease; two operators
  # would race the key rotation. Scale to 0 for the "self-restart without the operator" test.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tailnet-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tailnet-operator
    spec:
      serviceAccountName: tailnet-operator
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: operator
          image: ghcr.io/fr0st-dev/tailnet-operator:latest
          args: []
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Agents default to the operator's own image; one push serves both planes.
            - name: OPERATOR_IMAGE
              value: ghcr.io/fr0st-dev/tailnet-operator:latest
          ports:
            - name: metrics
              containerPort: 8080
            - name: health
              containerPort: 8081
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            initialDelaySeconds: 15
          readinessProbe:
            httpGet:
              path: /readyz
              port: health
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 128Mi
