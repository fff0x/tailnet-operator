---
apiVersion: v1
kind: Service
metadata:
  name: tailnet-operator-metrics
  namespace: tailnet-system
  labels:
    app.kubernetes.io/name: tailnet-operator
spec:
  selector:
    app.kubernetes.io/name: tailnet-operator
  ports:
    - name: metrics
      port: 8080
      targetPort: metrics
---
# Requires the Prometheus operator CRDs. Drop this file from the kustomization if you scrape another
# way; the operator serves plain /metrics on :8080 regardless.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: tailnet-operator
  namespace: tailnet-system
  labels:
    app.kubernetes.io/name: tailnet-operator
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: tailnet-operator
  endpoints:
    - port: metrics
      interval: 30s
