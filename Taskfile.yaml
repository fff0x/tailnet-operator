---
version: "3"

vars:
  # Chart publication destination; the current broker needs separate mixed-repo publishing support.
  OCI_CHART_PATH: oci://oci.this-is-fine.io/charts
  # Injected into the OCI version label; ci-build overrides this too.
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    cmds:
      - task: lint
      - task: test

  build:
    desc: Build both binaries
    cmds:
      - go build ./...

  test:
    desc: Run unit tests
    cmds:
      - go test ./...

  e2e:
    desc: Run isolated Tier-1 tests with real Headscale (downloads pinned assets; no cluster)
    cmds:
      - bash hack/e2e.sh {{.CLI_ARGS}}

  e2e-kind:
    desc: Run disposable installation and leader failover (local rootless Podman and delegated cgroups required)
    cmds:
      - bash hack/e2e-kind.sh

  e2e-full:
    desc: "Everything: the CI gate (lint, unit, chart, admission, Tier 1) plus every Tier-2 kind suite; ~75 min, see CONTRIBUTING.md for the required delegated scope"
    cmds:
      - bash hack/ci-test.sh
      - bash hack/e2e-kind.sh
      - bash hack/e2e-kind-projection.sh
      - bash hack/e2e-kind-projection.sh --rest-only
      - bash hack/e2e-kind-projection.sh --gateway-preflight-only
      - bash hack/e2e-kind-projection.sh --gateway-fresh-only

  ci-local:
    desc: Run the CI gate (hack/ci-test.sh) in the CI test container, as the broker does; needs podman
    cmds:
      - bash hack/ci-local.sh

  test-validation:
    desc: Validate CRDs, examples, optional LIVE_CR_FILE and gateway persistence in isolated envtest API servers
    requires:
      vars: [KUBEBUILDER_ASSETS]
    cmds:
      - go test -tags=integration ./test/validation ./internal/gateway -count=1 -v

  test-gateway-dns:
    desc: Check experimental gateway DNS with an explicit CoreDNS binary (loopback only)
    requires:
      vars: [COREDNS_BINARY]
    cmds:
      - go test -mod=readonly -tags=gatewaydns ./test/gateway-dns -count=1 -v -timeout=90s

  validate-examples:
    desc: Check invalid fixtures against the current kube-context (server dry-run only)
    cmds:
      - bash hack/validate-examples.sh {{.CLI_ARGS}}

  lint:
    desc: gofmt + go vet
    cmds:
      # gofmt -l prints unformatted files; make it fail the task if the list is non-empty.
      - test -z "$(gofmt -l cmd internal api test hack)"
      - go vet ./...

  security:
    desc: Check reachable Go vulnerabilities using the version-pinned scanner and current public database
    cmds:
      - GOTOOLCHAIN=local go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

  crds:
    desc: Regenerate DeepCopy + CRDs from the Go types
    cmds:
      - go tool controller-gen object crd paths=./api/... output:crd:dir=deploy/crds
      - mkdir -p charts/tailnet-operator/crds
      - cp deploy/crds/*.yaml charts/tailnet-operator/crds/
      - task: docs

  docs:
    desc: Regenerate docs/reference/crds.md (from deploy/crds) and values.md (helm-docs); no cluster
    cmds:
      # The golden test in hack/gendocs fails CI when crds.md drifts from the CRDs.
      - go run ./hack/gendocs
      - helm-docs --chart-search-root charts --template-files "{{.ROOT_DIR}}/docs/reference/values.md.gotmpl" --output-file ../../docs/reference/values.md --log-level error
      # ponytail: reference/{metrics,alerts,reasons}.md are curated by hand — reason constants are
      # spread over several packages and a generator for them is its own piece of work.

  chart:
    desc: Generate chart docs, lint/render/validate, check generated files and run chart contracts (no cluster)
    cmds:
      - helm-docs --chart-search-root charts --log-level error
      - task: docs
      - bash hack/chart-check.sh
      - bash hack/rbac-diff.sh --check
      - go test -tags=chart ./test/chart -count=1

  rbac-check:
    desc: Compare default chart RBAC with the reviewed permission reference (no cluster)
    cmds:
      - bash hack/rbac-diff.sh --check

  rbac-gen:
    desc: Update the RBAC reference after reviewing intentional permission changes
    cmds:
      - bash hack/rbac-diff.sh --write

  deploy-gen:
    desc: Regenerate the standalone kustomize bundle from default chart values (no cluster)
    cmds:
      - bash hack/deploy-gen.sh

  crd-upgrade:
    desc: Apply reviewed CRDs to an explicitly selected cluster (Helm CLI does not upgrade CRDs)
    requires:
      vars: [KUBE_CONTEXT]
    cmds:
      - kubectl --context {{.KUBE_CONTEXT | shellQuote}} apply --server-side -f deploy/crds {{.CLI_ARGS}}

  image:
    # Bundle mode (ARG BUNDLE=1): this produces a FROM-scratch image carrying /bundle, NOT a
    # `docker run`-able container. ci-build repacks it into the signed multi-arch index; the
    # authoritative build is CI. Locally this is only good for inspecting the /bundle layout.
    desc: Build the bundle image (operator + agent, all arches)
    vars:
      TAG: '{{.TAG | default "tailnet/operator:dev"}}'
    cmds:
      - "docker build --build-arg APP_VERSION={{.VERSION}} -t {{.TAG}} ."

  install:
    desc: Apply CRDs + operator to the current kube-context
    deps: [crds]
    cmds:
      - kubectl apply -k deploy
