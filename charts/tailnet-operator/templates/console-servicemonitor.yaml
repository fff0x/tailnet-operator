{{- if and .Values.monitoring.serviceMonitor.enabled .Values.console.enabled .Values.console.accessManagement.enabled }}
# The console's metrics: undecided access requests and audit chain breaks. Its own selector keeps
# it apart from the operator's ServiceMonitor.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ printf "%s-console" (include "tailnet-operator.name" .) | quote }}
  namespace: {{ include "tailnet-operator.namespace" . | quote }}
  labels:
    {{- mergeOverwrite (include "tailnet-operator.consoleLabels" . | fromYaml) .Values.monitoring.serviceMonitor.labels | toYaml | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "tailnet-operator.consoleSelector" . | nindent 6 }}
  endpoints:
    - port: metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
{{- end }}
