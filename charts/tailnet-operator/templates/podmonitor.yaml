{{- if .Values.monitoring.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ printf "%s-agents" (include "tailnet-operator.name" .) | quote }}
  namespace: {{ include "tailnet-operator.namespace" . | quote }}
  labels:
    {{- mergeOverwrite (include "tailnet-operator.labels" . | fromYaml) .Values.monitoring.podMonitor.labels | toYaml | nindent 4 }}
spec:
  namespaceSelector:
    {{- toYaml .Values.monitoring.podMonitor.namespaceSelector | nindent 4 }}
  selector:
    matchExpressions:
      - key: app.kubernetes.io/name
        operator: In
        values: [tailnet-egress, tailnet-ingress, tailnet-gateway]
  # Agents expose containerboot metrics on port `health` (TCP/9080); gateways on
  # port `kernel-health` (TCP/8080) plus CoreDNS metrics on `metrics-dns` (9153).
  # Pods without a given port silently produce no scrape target.
  podMetricsEndpoints:
    - port: health
      path: /metrics
      interval: {{ .Values.monitoring.podMonitor.interval }}
    - port: kernel-health
      path: /metrics
      interval: {{ .Values.monitoring.podMonitor.interval }}
    - port: metrics-dns
      path: /metrics
      interval: {{ .Values.monitoring.podMonitor.interval }}
{{- end }}
