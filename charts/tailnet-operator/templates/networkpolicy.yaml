{{- if and .Values.networkPolicy.enabled (eq .Values.networkPolicy.provider "kubernetes") }}
{{- if not .Values.networkPolicy.kubeAPICIDRs }}
{{- fail "networkPolicy.kubeAPICIDRs is required when networkPolicy.enabled=true" }}
{{- end }}
{{- if not .Values.networkPolicy.headscaleCIDRs }}
{{- fail "networkPolicy.headscaleCIDRs is required when networkPolicy.enabled=true" }}
{{- end }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "tailnet-operator.name" . | quote }}
  namespace: {{ include "tailnet-operator.namespace" . | quote }}
spec:
  podSelector:
    matchLabels:
      {{- include "tailnet-operator.selector" . | nindent 6 }}
  policyTypes: [Ingress, Egress]
  {{- if .Values.networkPolicy.metricsPeers }}
  ingress:
    - from:
        {{- toYaml .Values.networkPolicy.metricsPeers | nindent 8 }}
      ports:
        - {protocol: TCP, port: 8080}
  {{- else }}
  ingress: []
  {{- end }}
  egress:
    {{- with .Values.networkPolicy.dnsPeers }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    {{- end }}
    - to:
        {{- range .Values.networkPolicy.kubeAPICIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.kubeAPIPorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    - to:
        {{- range .Values.networkPolicy.headscaleCIDRs }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range .Values.networkPolicy.headscalePorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    # Status scrapes include tenant ingress pods, not just the operator namespace.
    - to:
        - namespaceSelector: {}
          podSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values: [tailnet-egress, tailnet-ingress]
      ports:
        - {protocol: TCP, port: 9080}
    # Spoke API servers for Tailnet.spec.policy.spokes[]: an egress agent pod (label peers on its
    # listen port) or an address outside the cluster (ipBlock). Nothing by default.
    {{- with .Values.networkPolicy.spokePeers }}
    - to:
        {{- toYaml . | nindent 8 }}
      ports:
        {{- range $.Values.networkPolicy.spokePorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.spokeCIDRs }}
    - to:
        {{- range . }}
        - ipBlock: {cidr: {{ . | quote }}}
        {{- end }}
      ports:
        {{- range $.Values.networkPolicy.spokePorts }}
        - {protocol: TCP, port: {{ . }}}
        {{- end }}
    {{- end }}
{{- end }}
