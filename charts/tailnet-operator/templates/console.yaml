{{- if .Values.console.enabled }}
{{- include "tailnet-operator.validateConsole" . }}
{{- $name := printf "%s-console" (include "tailnet-operator.name" .) }}
{{- $ns := include "tailnet-operator.namespace" . }}
{{- $c := .Values.console }}
{{- $am := $c.accessManagement }}
{{- $audit := printf "%s-audit" $name }}
# Web console, read-only unless accessManagement. Its own labels keep it out of the operator's
# selectors, PDB and monitors.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "tailnet-operator.consoleLabels" . | nindent 4 }}
---
# Read access to four kinds and nothing else: no Secrets, no ConfigMaps. With accessManagement
# the console also writes TailnetGrants and TailnetAccessRequests, but never deletes one.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "tailnet-operator.consoleLabels" . | nindent 4 }}
rules:
  - apiGroups: [tsunaro.io]
    resources: [tailnets, tailnetingresses, tailnetsites, tailnetgrants]
    verbs: [get, list, watch]
  {{- if $am.enabled }}
  - apiGroups: [tsunaro.io]
    resources: [tailnetgrants]
    verbs: [create, update, patch]
  - apiGroups: [tsunaro.io]
    resources: [tailnetaccessrequests]
    verbs: [get, list, watch, create]
  - apiGroups: [tsunaro.io]
    resources: [tailnetaccessrequests/status]
    verbs: [update, patch]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name | quote }}
  labels:
    {{- include "tailnet-operator.consoleLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $name | quote }}
    namespace: {{ $ns | quote }}
---
{{- if $am.enabled }}
{{- if not $am.audit.existingClaim }}
# The audit log. Helm keeps it on uninstall: it is the record of who changed which access.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $audit | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "tailnet-operator.consoleLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes: [ReadWriteOnce]
  {{- with $am.audit.storageClassName }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $am.audit.size | quote }}
---
{{- end }}
# The head of the audit chain, written by the console after every entry. The chart renders no
# data, so an upgrade keeps it; Flux must not correct it either.
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $audit | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "tailnet-operator.consoleLabels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
    helm.toolkit.fluxcd.io/driftDetection: disabled
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $audit | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "tailnet-operator.consoleLabels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [{{ $audit | quote }}]
    verbs: [get, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $audit | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "tailnet-operator.consoleLabels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ $audit | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ $name | quote }}
    namespace: {{ $ns | quote }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "tailnet-operator.consoleLabels" . | nindent 4 }}
spec:
  selector:
    {{- include "tailnet-operator.consoleSelector" . | nindent 4 }}
  ports:
    - {name: http, port: 8080, targetPort: http}
    {{- if $am.enabled }}
    - {name: metrics, port: 8081, targetPort: metrics}
    {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name | quote }}
  namespace: {{ $ns | quote }}
  labels:
    {{- include "tailnet-operator.consoleLabels" . | nindent 4 }}
spec:
  replicas: 1
  # The session key lives in memory: a second replica could not open the first one's cookies.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "tailnet-operator.consoleSelector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tailnet-operator.consoleLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ $name | quote }}
      securityContext:
        {{- if $am.enabled }}
        {{- toYaml (merge (deepCopy .Values.podSecurityContext) (dict "fsGroup" 65532 "fsGroupChangePolicy" "OnRootMismatch")) | nindent 8 }}
        {{- else }}
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
        {{- end }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: console
          image: {{ include "tailnet-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/tailnet-console"]
          env:
            # The scratch bundle carries the CA roots here, for the identity provider.
            - name: SSL_CERT_FILE
              value: /ca-certificates.crt
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: console
                  resource: limits.memory
            - name: CONSOLE_URL
              value: {{ $c.url | quote }}
            - name: OIDC_ISSUER
              value: {{ $c.oidc.issuer | quote }}
            - name: OIDC_CLIENT_ID
              value: {{ $c.oidc.clientID | quote }}
            - name: OIDC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $c.oidc.clientSecretRef.name | quote }}
                  key: {{ $c.oidc.clientSecretRef.key | quote }}
            - name: OIDC_SCOPES
              value: {{ join " " $c.oidc.scopes | quote }}
            - name: CONSOLE_ADMIN_GROUP
              value: {{ $c.oidc.adminGroup | quote }}
            - name: CONSOLE_USER_GROUP
              value: {{ $c.oidc.userGroup | quote }}
            - name: CONSOLE_OPERATOR_URL
              value: {{ printf "http://%s-console-api.%s.svc:8082" (include "tailnet-operator.name" .) $ns | quote }}
            - name: CONSOLE_API_TOKEN_FILE
              value: /var/run/secrets/tsunaro.io/console-api/token
            {{- if $am.enabled }}
            - name: CONSOLE_AUDIT_DIR
              value: /var/lib/tsunaro-console
            - name: CONSOLE_AUDIT_ANCHOR
              value: {{ $audit | quote }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: CONSOLE_FOUR_EYES
              value: {{ $am.fourEyes | toString | quote }}
            {{- end }}
          ports:
            - {name: http, containerPort: 8080}
            {{- if $am.enabled }}
            - {name: metrics, containerPort: 8081}
            {{- end }}
          volumeMounts:
            - name: console-api-token
              mountPath: /var/run/secrets/tsunaro.io/console-api
              readOnly: true
            {{- if $am.enabled }}
            - name: audit
              mountPath: /var/lib/tsunaro-console
            {{- end }}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: http}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml $c.resources | nindent 12 }}
      volumes:
        # Audience tailnet-operator: useless against the API server, rotated by the kubelet.
        - name: console-api-token
          projected:
            sources:
              - serviceAccountToken:
                  audience: tailnet-operator
                  expirationSeconds: 600
                  path: token
        {{- if $am.enabled }}
        - name: audit
          persistentVolumeClaim:
            claimName: {{ $am.audit.existingClaim | default $audit | quote }}
        {{- end }}
{{- end }}
