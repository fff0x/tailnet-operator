apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-metrics" (include "tailnet-operator.name" .) | quote }}
  namespace: {{ include "tailnet-operator.namespace" . | quote }}
  labels:
    {{- include "tailnet-operator.selector" . | nindent 4 }}
spec:
  selector:
    {{- include "tailnet-operator.selector" . | nindent 4 }}
  ports:
    - {name: metrics, port: 8080, targetPort: metrics}
