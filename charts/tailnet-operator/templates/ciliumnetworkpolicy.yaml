{{- if and .Values.networkPolicy.enabled (eq .Values.networkPolicy.provider "cilium") }}
{{- if and (not .Values.networkPolicy.cilium.headscalePeers) (not .Values.networkPolicy.headscaleCIDRs) }}
{{- fail "networkPolicy.provider cilium requires at least one of networkPolicy.cilium.headscalePeers (in-cluster) or networkPolicy.headscaleCIDRs (remote Headscale)" }}
{{- end }}
# Egress: the operator may reach exactly the destinations it dials. If any rule is missing the
# operator fails silently; keep this in sync with what internal/controller dials. Ingress stays
# open without the console; with it, only the console reaches the console API on :8082, and
# metrics (:8080) and health (:8081) stay open by an explicit rule.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: {{ include "tailnet-operator.name" . | quote }}
  namespace: {{ include "tailnet-operator.namespace" . | quote }}
spec:
  endpointSelector:
    matchLabels:
      {{- include "tailnet-operator.selector" . | nindent 6 }}
  {{- if .Values.console.enabled }}
  # An ingress section puts the pod into default deny for ingress: every port needs a rule.
  ingress:
    - fromEndpoints:
        - matchLabels:
            {{- include "tailnet-operator.consoleSelector" . | nindent 12 }}
      toPorts:
        - ports:
            - {port: "8082", protocol: TCP}
    - fromEntities:
        - all
      toPorts:
        - ports:
            - {port: "8080", protocol: TCP}
            - {port: "8081", protocol: TCP}
  {{- end }}
  egress:
    # 1. kube-apiserver — watch/patch CRs, Secrets, child objects
    - toEntities:
        - kube-apiserver
    {{- with .Values.networkPolicy.dnsPeers }}
    # 2. cluster DNS — resolve the Headscale Service and the agent pods
    - toEndpoints:
        {{- include "tailnet-operator.ciliumEndpoints" . | trim | nindent 8 }}
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    {{- end }}
    # 3. Headscale — the REST API (mint/rotate keys, list nodes, read/write policy).
    # In-cluster Headscale is expressed as label peers (toEndpoints). A Headscale that lives
    # outside the cluster (shared control plane, spoke clusters) is unreachable through
    # toEndpoints; declare it as toCIDR instead — Cilium's cilium.io/v2 CIDR syntax, not
    # toEntities. Both blocks may coexist; at least one is required (fail guard above).
    {{- with .Values.networkPolicy.cilium.headscalePeers }}
    - toEndpoints:
        {{- include "tailnet-operator.ciliumEndpoints" . | trim | nindent 8 }}
      toPorts:
        - ports:
            {{- range $.Values.networkPolicy.headscalePorts }}
            - {port: {{ . | quote }}, protocol: TCP}
            {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.headscaleCIDRs }}
    - toCIDR:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            {{- range $.Values.networkPolicy.headscalePorts }}
            - {port: {{ . | quote }}, protocol: TCP}
            {{- end }}
    {{- end }}
    # 4. agent pods — scrape /status and /targets on :9080. Cilium scopes toEndpoints to the
    #    policy namespace unless the namespace label is matched; ingress agents run in tenant
    #    namespaces, so select across all of them.
    - toEndpoints:
        - matchLabels:
            app.kubernetes.io/name: tailnet-egress
        - matchLabels:
            app.kubernetes.io/name: tailnet-ingress
          matchExpressions:
            - key: k8s:io.kubernetes.pod.namespace
              operator: Exists
      toPorts:
        - ports:
            - {port: "9080", protocol: TCP}
    # 5. spoke API servers — fetch the exported policy fragment (Tailnet.spec.policy.spokes[]).
    #    A spoke behind a TailnetEgress is reached via that CR's agent pod on its listen port
    #    (label peers); an API address outside the cluster is a toCIDR. Nothing by default.
    {{- with .Values.networkPolicy.spokePeers }}
    - toEndpoints:
        {{- include "tailnet-operator.ciliumEndpoints" . | trim | nindent 8 }}
      toPorts:
        - ports:
            {{- range $.Values.networkPolicy.spokePorts }}
            - {port: {{ . | quote }}, protocol: TCP}
            {{- end }}
    {{- end }}
    {{- with .Values.networkPolicy.spokeCIDRs }}
    - toCIDR:
        {{- range . }}
        - {{ . | quote }}
        {{- end }}
      toPorts:
        - ports:
            {{- range $.Values.networkPolicy.spokePorts }}
            - {port: {{ . | quote }}, protocol: TCP}
            {{- end }}
    {{- end }}
{{- end }}
