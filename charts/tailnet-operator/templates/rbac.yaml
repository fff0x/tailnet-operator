---
# Read CR specs and write status; never mutate CR specs.
# Finalizers-update authorization permits existing blocking owner references.
# TailnetIngress lives in any tenant namespace. TailnetEgress stays in the Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-crds" (include "tailnet-operator.name" .) | quote }}
rules:
  - apiGroups: ["tsunaro.io"]
    resources: [tailnets]
    verbs: [get, list, watch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnets/status]
    verbs: [get, update, patch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetingresses]
    verbs: [get, list, watch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetingresses/status]
    verbs: [get, update, patch]
  # Gateway controller only reports suspension; no workload/finalizer rights.
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetgateways]
    verbs: [get, list, watch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetgateways/status]
    verbs: [get, update, patch]
  # OwnerReferencesPermissionEnforcement checks this authorization, including
  # when a child is created. Preserve foreground-GC behavior without CR spec writes.
  - apiGroups: ["tsunaro.io"]
    resources: [tailnets/finalizers, tailnetingresses/finalizers]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-crds" (include "tailnet-operator.name" .) | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-crds" (include "tailnet-operator.name" .) | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tailnet-operator.name" . | quote }}
    namespace: {{ include "tailnet-operator.namespace" . | quote }}
---
# Tenant ingress children require cluster-wide workload access, including Secrets.
# Splitting roles makes this visible; it does not provide tenant isolation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-workloads" (include "tailnet-operator.name" .) | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # Optional issuer workflow uses direct namespaced requests, not an informer.
  # No Issuer, ClusterIssuer, CertificateRequest or CRD-object access is required.
  - apiGroups: ["cert-manager.io"]
    resources: [certificates]
    verbs: [get, create, patch, delete]
  # Scraped for /targets to report backend reachability.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-workloads" (include "tailnet-operator.name" .) | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-workloads" (include "tailnet-operator.name" .) | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tailnet-operator.name" . | quote }}
    namespace: {{ include "tailnet-operator.namespace" . | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tailnet-operator.name" . | quote }}
  namespace: {{ include "tailnet-operator.namespace" . | quote }}
rules:
  {{- if .Values.leaderElection.enabled }}
  # Election is namespaced; replicas share the fixed manager Lease ID.
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  {{- end }}
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetegresses]
    verbs: [get, list, watch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetegresses/status]
    verbs: [get, update, patch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetegresses/finalizers]
    verbs: [update]
  # Services are namespace-only. The other workload rules are explicit here for
  # egress, but already granted globally by -workloads (including these Secrets).
  - apiGroups: [""]
    resources: [secrets, configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  # Scraped for /status and /targets to classify missing routes.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tailnet-operator.name" . | quote }}
  namespace: {{ include "tailnet-operator.namespace" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tailnet-operator.name" . | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tailnet-operator.name" . | quote }}
    namespace: {{ include "tailnet-operator.namespace" . | quote }}
