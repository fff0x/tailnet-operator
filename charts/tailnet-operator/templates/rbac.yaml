---
# Read CR specs and write status; never mutate CR specs.
# Finalizers-update authorization permits existing blocking owner references.
# TailnetIngress lives in any tenant namespace. TailnetEgress stays in the Role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-crds" (include "tailnet-operator.name" .) | quote }}
rules:
  - apiGroups: ["tsunaro.io"]
    resources: [tailnets]
    verbs: [get, list, watch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnets/status]
    verbs: [get, update, patch]
  # patch exists only to add/remove the authkey finalizer that expires the CR's
  # pre-auth key on delete; the code never patches spec.
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetingresses]
    verbs: [get, list, watch, patch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetingresses/status]
    verbs: [get, update, patch]
  # Gateway activation is explicit; fresh child creation is namespaced below.
  # patch exists only to add/remove the deletionPolicy=Delete teardown finalizer;
  # CEL keeps identity fields immutable for every writer and the code never
  # patches spec. No update/delete on the CR itself.
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetgateways]
    verbs: [get, list, watch, patch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetgateways/status]
    verbs: [get, update, patch]
  # Sites are read by the policy controller and only their status is written.
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetsites]
    verbs: [get, list, watch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetsites/status]
    verbs: [get, update, patch]
  # OwnerReferencesPermissionEnforcement checks this authorization, including
  # when a child is created. Preserve foreground-GC behavior without CR spec writes.
  - apiGroups: ["tsunaro.io"]
    resources: [tailnets/finalizers, tailnetingresses/finalizers]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-crds" (include "tailnet-operator.name" .) | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-crds" (include "tailnet-operator.name" .) | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tailnet-operator.name" . | quote }}
    namespace: {{ include "tailnet-operator.namespace" . | quote }}
---
# Tenant ingress children require cluster-wide workload access, including Secrets.
# Splitting roles makes this visible; it does not provide tenant isolation.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ printf "%s-workloads" (include "tailnet-operator.name" .) | quote }}
rules:
  - apiGroups: [""]
    resources: [secrets, configmaps]
    verbs: [get, list, watch, create, update, patch, delete]
  # Each ingress agent gets its own ServiceAccount and a Role on its one tsnet
  # state Secret (get/update/patch), so a restarted pod keeps its node identity.
  # Applied server-side (create + patch), removed by owner GC; the operator already
  # holds the granted Secret verbs, so no escalate/bind is needed.
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, create, patch]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings]
    verbs: [get, create, patch]
  # Optional issuer workflow uses direct namespaced requests, not an informer.
  # No Issuer, ClusterIssuer, CertificateRequest or CRD-object access is required.
  - apiGroups: ["cert-manager.io"]
    resources: [certificates]
    verbs: [get, create, patch, delete]
  # Scraped for /targets to report backend reachability.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ printf "%s-workloads" (include "tailnet-operator.name" .) | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ printf "%s-workloads" (include "tailnet-operator.name" .) | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tailnet-operator.name" . | quote }}
    namespace: {{ include "tailnet-operator.namespace" . | quote }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tailnet-operator.name" . | quote }}
  namespace: {{ include "tailnet-operator.namespace" . | quote }}
rules:
  {{- if .Values.leaderElection.enabled }}
  # Election is namespaced; replicas share the fixed manager Lease ID.
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
  {{- end }}
  # patch exists only to add/remove the authkey finalizer that expires the CR's
  # pre-auth key on delete; the code never patches spec.
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetegresses]
    verbs: [get, list, watch, patch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetegresses/status]
    verbs: [get, update, patch]
  - apiGroups: ["tsunaro.io"]
    resources: [tailnetegresses/finalizers]
    verbs: [update]
  # Services are namespace-only. The other workload rules are explicit here for
  # egress, but already granted globally by -workloads (including these Secrets).
  - apiGroups: [""]
    resources: [secrets, configmaps, services]
    verbs: [get, list, watch, create, update, patch, delete]
  # Fresh Gateways use direct uncached get/create requests in this namespace.
  # delete serves deletionPolicy=Delete teardown only and is always sent with a
  # UID precondition against the UID recorded at Create. Only the StatefulSet
  # also gets update, to follow image/dns.image in spec.template (OnDelete never
  # restarts the Pod). No child informer, adoption or RBAC escalation (escalate/bind).
  - apiGroups: [""]
    resources: [serviceaccounts]
    verbs: [get, create, delete]
  - apiGroups: ["apps"]
    resources: [statefulsets]
    verbs: [get, create, update, delete]
  - apiGroups: ["policy"]
    resources: [poddisruptionbudgets]
    verbs: [get, create, delete]
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: [roles, rolebindings]
    verbs: [get, create, delete]
  # Scraped for /status and /targets to classify missing routes.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tailnet-operator.name" . | quote }}
  namespace: {{ include "tailnet-operator.namespace" . | quote }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tailnet-operator.name" . | quote }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tailnet-operator.name" . | quote }}
    namespace: {{ include "tailnet-operator.namespace" . | quote }}
