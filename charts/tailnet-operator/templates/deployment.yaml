{{- include "tailnet-operator.validate" . }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "tailnet-operator.name" . | quote }}
  namespace: {{ include "tailnet-operator.namespace" . | quote }}
  labels:
    {{- include "tailnet-operator.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  strategy:
    {{- if .Values.leaderElection.enabled }}
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    {{- else }}
    # Without election, old and new operator processes must never overlap.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "tailnet-operator.selector" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "tailnet-operator.labels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "tailnet-operator.name" . | quote }}
      # The manager has a 20-second drain budget; leave time for process exit.
      terminationGracePeriodSeconds: 30
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: operator
          image: {{ include "tailnet-operator.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/tailnet-operator"]
          args: [{{ printf "--leader-elect=%t" .Values.leaderElection.enabled | quote }}]
          env:
            # The scratch bundle carries the CA roots here, for HTTPS Headscale APIs.
            - name: SSL_CERT_FILE
              value: /ca-certificates.crt
            {{- if .Values.headscale.caConfigMapRef.name }}
            # Go merges SSL_CERT_DIR with SSL_CERT_FILE: the site CA joins the public roots.
            - name: SSL_CERT_DIR
              value: /etc/tailnet-operator/ca
            {{- end }}
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            # Go's soft memory limit follows the container limit (bytes); without a limit the
            # Downward API reports node allocatable, which leaves the runtime default in effect.
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: operator
                  resource: limits.memory
            - name: OPERATOR_IMAGE
              value: {{ include "tailnet-operator.agentImage" . | quote }}
            - name: AGENT_IMAGE_PULL_SECRETS
              value: {{ .Values.agent.imagePullSecrets | toJson | quote }}
            - name: AGENT_RESOURCES
              value: {{ .Values.agent.resources | default dict | toJson | quote }}
            - name: AGENT_SCRAPE_PEERS
              value: {{ .Values.monitoring.podMonitor.scrapeFrom | default list | toJson | quote }}
            {{- with .Values.env.extra }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - {name: metrics, containerPort: 8080}
            - {name: health, containerPort: 8081}
          livenessProbe:
            httpGet: {path: /healthz, port: health}
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: {path: /readyz, port: health}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          {{- with .Values.headscale.caConfigMapRef }}
          {{- if .name }}
          volumeMounts:
            - name: headscale-ca
              mountPath: /etc/tailnet-operator/ca
              readOnly: true
          {{- end }}
          {{- end }}
      {{- with .Values.headscale.caConfigMapRef }}
      {{- if .name }}
      volumes:
        - name: headscale-ca
          configMap:
            name: {{ .name | quote }}
            items:
              - key: {{ .key | quote }}
                path: ca.crt
      {{- end }}
      {{- end }}
