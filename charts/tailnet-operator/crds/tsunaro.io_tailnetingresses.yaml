---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tailnetingresses.tsunaro.io
spec:
  group: tsunaro.io
  names:
    kind: TailnetIngress
    listKind: TailnetIngressList
    plural: tailnetingresses
    shortNames:
    - tning
    singular: tailnetingress
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.tag
      name: Tag
      type: string
    - jsonPath: .status.hostname
      name: Hostname
      type: string
    - jsonPath: .status.dnsName
      name: DNS
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TailnetIngress exposes in-cluster L4 services on the tailnet as one tsnet node with a MagicDNS
          name. It lives in the tenant namespace; the tag's grants decide which tailnet peers may reach it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TailnetIngressSpec exposes in-cluster services through one tsnet node. L4 forwards TCP;
              HTTP mode terminates TLS and proxies HTTP or explicitly verified HTTPS to the selected backend.
            properties:
              allowFrom:
                description: |-
                  Peers allowed to reach this node (policy grant src), e.g. ["group:team-a"]. Only used when
                  the Tailnet generates policy; every entry must match Tailnet.spec.policy.ingressSourceAllowlist,
                  otherwise the CR gets PolicyDenied and no grant is written.
                items:
                  minLength: 1
                  type: string
                minItems: 1
                type: array
              exposes:
                items:
                  description: Expose publishes one in-cluster backend on the tailnet
                    node, listening on Port.
                  properties:
                    alias:
                      description: |-
                        Request a shorter DNS alias for this HTTP expose, rendered from the Tailnet's
                        ingressAliasTemplate with the effective label (dnsLabel or the CR name). Requires
                        ingressAliasTemplate to be set; otherwise the CR reports InvalidDNSName.
                      type: boolean
                    backend:
                      description: |-
                        Backend is the in-cluster Service an Expose forwards to. Namespace defaults to the CR's
                        namespace; an explicit namespace can reference a shared gateway or another backend.
                      properties:
                        namespace:
                          description: |-
                            Namespace of the Service. Empty → the CR's namespace. Set it to funnel HTTPS through a
                            shared gateway (e.g. Envoy in envoy-gateway-system) so TLS terminates there while the tailnet
                            identity stays per app.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        port:
                          format: int32
                          maximum: 65535
                          minimum: 1
                          type: integer
                        service:
                          description: Service name; in the CR's own namespace unless
                            Namespace is set.
                          maxLength: 63
                          pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                          type: string
                        tls:
                          description: Verified HTTPS to the backend. Omission preserves
                            plaintext HTTP.
                          properties:
                            caConfigMapRef:
                              description: Public CA bundle in the ingress CR namespace,
                                even if the backend is elsewhere.
                              properties:
                                key:
                                  maxLength: 253
                                  minLength: 1
                                  pattern: ^[-._a-zA-Z0-9]+$
                                  type: string
                                name:
                                  maxLength: 253
                                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                                  type: string
                              required:
                              - key
                              - name
                              type: object
                            serverName:
                              description: DNS name verified against the backend certificate;
                                does not change the dial address or HTTP Host.
                              maxLength: 253
                              pattern: ^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?(\.[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$
                              type: string
                              x-kubernetes-validations:
                              - message: serverName must be a DNS name, not an IP
                                  address
                                rule: '!isIP(self)'
                          required:
                          - caConfigMapRef
                          - serverName
                          type: object
                      required:
                      - port
                      - service
                      type: object
                    dnsLabel:
                      description: |-
                        HTTP DNS label substituted for {name} in the Tailnet's ingressNameTemplate.
                        Omitted or empty uses the ingress-level name; does not change the expose identifier.
                      maxLength: 63
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?)?$
                      type: string
                    mode:
                      default: l4
                      description: Listener mode. Omitted means L4 forwarding; HTTP
                        requests TLS termination.
                      enum:
                      - l4
                      - http
                      maxLength: 4
                      type: string
                    name:
                      description: DNS label; identifies the expose in status and
                        in the agent config.
                      maxLength: 63
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                      type: string
                    port:
                      description: Port the tailnet node listens on — what a tailnet
                        peer dials on this node's MagicDNS name/IP.
                      format: int32
                      maximum: 65535
                      minimum: 1
                      type: integer
                    timeouts:
                      description: HTTP-only timeout overrides.
                      properties:
                        backendRequest:
                          description: Wait for backend response headers after sending
                            the request body. Defaults to 30s.
                          maxLength: 32
                          pattern: ^([0-9]{1,5}(h|m|s|ms)){1,4}$
                          type: string
                        request:
                          description: Whole-response deadline. Omitted means no deadline.
                          maxLength: 32
                          pattern: ^([0-9]{1,5}(h|m|s|ms)){1,4}$
                          type: string
                      type: object
                  required:
                  - backend
                  - name
                  - port
                  type: object
                  x-kubernetes-validations:
                  - message: HTTP exposes must listen on port 443
                    rule: '!has(self.mode) || self.mode != ''http'' || self.port ==
                      443'
                  - message: backend TLS requires HTTP mode
                    rule: '!has(self.backend.tls) || (has(self.mode) && self.mode
                      == ''http'')'
                  - message: timeouts require HTTP mode
                    rule: '!has(self.timeouts) || (has(self.mode) && self.mode ==
                      ''http'')'
                  - message: dnsLabel requires HTTP mode
                    rule: '!has(self.dnsLabel) || (has(self.mode) && self.mode ==
                      ''http'')'
                  - message: alias requires HTTP mode
                    rule: '!has(self.alias) || !self.alias || (has(self.mode) && self.mode
                      == ''http'')'
                maxItems: 50
                minItems: 1
                type: array
                x-kubernetes-validations:
                - message: L4 expose ports must be unique and must not overlap HTTP
                    ports
                  rule: self.all(e, (has(e.mode) && e.mode == 'http') || self.exists_one(other,
                    other.port == e.port))
                - message: expose names must be unique
                  rule: self.all(e, self.exists_one(other, other.name == e.name))
                - message: at most one HTTP expose without a nonempty dnsLabel is
                    allowed
                  rule: self.filter(e, has(e.mode) && e.mode == 'http' && (!has(e.dnsLabel)
                    || e.dnsLabel == '')).size() <= 1
                - message: nonempty HTTP dnsLabels must be unique
                  rule: self.all(e, !has(e.mode) || e.mode != 'http' || !has(e.dnsLabel)
                    || e.dnsLabel == '' || self.filter(other, has(other.mode) && other.mode
                    == 'http' && has(other.dnsLabel) && other.dnsLabel == e.dnsLabel).size()
                    == 1)
              hostname:
                description: Explicit tailnet (MagicDNS) hostname. Empty → rendered
                  from the Tailnet's ingressHostnameTemplate.
                type: string
              image:
                description: Override the Tailnet's default agent image.
                type: string
              resources:
                description: Override the Tailnet's default agent resources.
                properties:
                  claims:
                    description: |-
                      Claims lists the names of resources, defined in spec.resourceClaims,
                      that are used by this container.

                      This field depends on the
                      DynamicResourceAllocation feature gate.

                      This field is immutable. It can only be set for containers.
                    items:
                      description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                      properties:
                        name:
                          description: |-
                            Name must match the name of one entry in pod.spec.resourceClaims of
                            the Pod where this field is used. It makes that resource available
                            inside a container.
                          type: string
                        request:
                          description: |-
                            Request is the name chosen for a request in the referenced claim.
                            If empty, everything from the claim is made available, otherwise
                            only the result of this request.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                    x-kubernetes-list-map-keys:
                    - name
                    x-kubernetes-list-type: map
                  limits:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Limits describes the maximum amount of compute resources allowed.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                  requests:
                    additionalProperties:
                      anyOf:
                      - type: integer
                      - type: string
                      pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                      x-kubernetes-int-or-string: true
                    description: |-
                      Requests describes the minimum amount of compute resources required.
                      If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                      otherwise to an implementation-defined value. Requests cannot exceed Limits.
                      More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                    type: object
                type: object
              tag:
                description: |-
                  Explicit tailnet tag. Empty → rendered from the Tailnet's ingressTagTemplate. The tag is the
                  authorization: policy grants with dst = this tag decide which peers may reach the node.
                type: string
              tailnetRef:
                description: TailnetRef selects a cluster-scoped Tailnet by name.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              tls:
                description: TLS source shared by the HTTP exposes. An omitted or
                  empty source may use Tailnet defaults.
                properties:
                  issuerRef:
                    description: |-
                      TLSIssuerReference identifies a cert-manager issuer without requiring its API dependency.
                      Issuer references resolve in the ingress namespace; ClusterIssuer references are cluster-scoped.
                    properties:
                      group:
                        default: cert-manager.io
                        description: Only cert-manager.io issuers are supported.
                        enum:
                        - cert-manager.io
                        type: string
                      kind:
                        default: Issuer
                        enum:
                        - Issuer
                        - ClusterIssuer
                        type: string
                      name:
                        description: Name of the issuer.
                        maxLength: 253
                        minLength: 1
                        pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                        type: string
                    required:
                    - name
                    type: object
                  secretName:
                    description: Existing TLS Secret in the ingress namespace.
                    maxLength: 253
                    minLength: 1
                    pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: tls.secretName and tls.issuerRef are mutually exclusive
                  rule: '!has(self.secretName) || !has(self.issuerRef)'
            required:
            - allowFrom
            - exposes
            - tailnetRef
            type: object
            x-kubernetes-validations:
            - message: tls requires an HTTP expose
              rule: '!has(self.tls) || self.exposes.exists(e, has(e.mode) && e.mode
                == ''http'')'
          status:
            description: TailnetIngressStatus is the observed state.
            properties:
              authKeyExpiresAt:
                description: Expiry of the reusable pre-auth key currently in the
                  agent's Secret.
                format: date-time
                type: string
              conditions:
                description: 'Conditions: TagKnown, Registered, BackendsReachable,
                  TLSReady, Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              dnsName:
                description: |-
                  DNS name rendered from the Tailnet's dns.ingressNameTemplate; resolves to TailnetIPs via the
                  hosts ConfigMap. Empty when no template is set.
                type: string
              exposes:
                items:
                  description: ExposeStatus is the per-expose observed state.
                  properties:
                    backend:
                      description: The in-cluster backend the agent dials, as service:port.
                      type: string
                    dnsAliases:
                      description: Additional resolved DNS aliases for an HTTP expose;
                        empty unless alias is requested and won.
                      items:
                        type: string
                      type: array
                    dnsName:
                      description: Resolved DNS name for an HTTP expose; empty for
                        L4.
                      type: string
                    listenPort:
                      description: Port the tailnet node listens on for this expose.
                      format: int32
                      type: integer
                    name:
                      type: string
                    reachable:
                      description: |-
                        Backend reachability. With backend TLS this requires a fresh verified handshake
                        bound to the current configuration, CA bundle and unexpired certificate.
                      type: boolean
                    reason:
                      description: Bounded backend or frontend failure reason; empty
                        when ready.
                      type: string
                    tlsReady:
                      description: |-
                        Local TLS component readiness for an HTTP expose; omitted for L4.
                        This does not establish remote tailnet reachability or client CA trust.
                      type: boolean
                  required:
                  - backend
                  - listenPort
                  - name
                  - reachable
                  type: object
                type: array
              hostname:
                type: string
              nodeId:
                type: string
              observedGeneration:
                format: int64
                type: integer
              tag:
                description: Effective tag (spec.tag or the Tailnet template) — what
                  the policy and the node carry.
                type: string
              tailnetIps:
                items:
                  type: string
                type: array
              tlsNotAfter:
                description: Expiry of the serving TLS certificate.
                format: date-time
                type: string
              tlsSecretName:
                description: Name of the effective TLS Secret in the ingress namespace;
                  never certificate or key content.
                type: string
            type: object
        required:
        - spec
        type: object
        x-kubernetes-validations:
        - message: name must be a DNS label of at most 40 characters
          rule: size(self.metadata.name) <= 40 && self.metadata.name.matches('^[a-z0-9]([-a-z0-9]*[a-z0-9])?$')
        - message: an HTTP dnsLabel equal to the ingress name conflicts with an unlabeled
            HTTP expose
          rule: '!self.spec.exposes.exists(e, has(e.mode) && e.mode == ''http'' &&
            (!has(e.dnsLabel) || size(e.dnsLabel) == 0)) || !self.spec.exposes.exists(e,
            has(e.mode) && e.mode == ''http'' && has(e.dnsLabel) && e.dnsLabel ==
            self.metadata.name)'
    served: true
    storage: true
    subresources:
      status: {}
