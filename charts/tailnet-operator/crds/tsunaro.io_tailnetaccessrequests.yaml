---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tailnetaccessrequests.tsunaro.io
spec:
  group: tsunaro.io
  names:
    kind: TailnetAccessRequest
    listKind: TailnetAccessRequestList
    plural: tailnetaccessrequests
    shortNames:
    - tnar
    singular: tailnetaccessrequest
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tailnetRef.name
      name: Tailnet
      type: string
    - jsonPath: .spec.action
      name: Action
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.grantName
      name: Grant
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          TailnetAccessRequest is a request for a TailnetGrant or its extension, kept by the console;
          its approvals are in the console's audit log. The operator ignores it.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TailnetAccessRequestSpec is what a person asked for. The console writes it once; it never
              changes. The operator does not read this kind: only an approved request becomes a TailnetGrant.
            properties:
              action:
                description: Create asks for a new TailnetGrant; Extend asks for a
                  new expiresAt of grantName.
                enum:
                - Create
                - Extend
                type: string
              description:
                maxLength: 253
                type: string
              duration:
                description: AccessDuration is a lifetime the console offers, counted
                  from the last approval.
                enum:
                - 1h
                - 8h
                - 24h
                - 7d
                - 30d
                - permanent
                type: string
              grantName:
                description: The console grant to extend.
                maxLength: 253
                pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                type: string
              ports:
                items:
                  format: int32
                  maximum: 65535
                  minimum: 1
                  type: integer
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              requestedAs:
                description: |-
                  The requester's console role at the time of the request; it decides how many approvals
                  the request needs.
                enum:
                - User
                - Admin
                type: string
              requester:
                description: Provider identifier (`<issuer>/<subject>`, as Headscale
                  builds it) of the person who asked.
                maxLength: 512
                minLength: 1
                type: string
              sources:
                description: Recipients of the grant to create, as in TailnetGrant.spec.sources.
                items:
                  maxLength: 512
                  minLength: 2
                  type: string
                maxItems: 16
                minItems: 1
                type: array
                x-kubernetes-list-type: set
                x-kubernetes-validations:
                - message: a source must be group:<name> or a user reference with
                    exactly one @; tags and autogroups are not allowed
                  rule: 'self.all(s, s.startsWith(''group:'') ? s.matches(''^group:[^[:space:]]+$'')
                    : (!s.startsWith(''tag:'') && !s.startsWith(''autogroup:'') &&
                    s.matches(''^[^@[:space:]]+@[^@[:space:]]*$'')))'
              tailnetRef:
                description: TailnetRef selects a cluster-scoped Tailnet by name.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
              target:
                description: |-
                  GrantTarget is what a TailnetGrant gives access to: one ingress node by tag, or hosts and
                  networks inside a TailnetSite by prefix.
                properties:
                  prefixes:
                    description: |-
                      Prefixes inside an unblocked TailnetSite of the same Tailnet. A /32 or /128 is a single
                      host. One prefix outside every site blocks the whole grant (TargetOutsideSites).
                    items:
                      description: |-
                        GatewayPrefix is a canonical, non-default subnet route. Network ownership and
                        reachability still require runtime validation against the selected Tailnet.
                      maxLength: 49
                      type: string
                      x-kubernetes-validations:
                      - message: route must be a canonical masked non-default CIDR
                        rule: isCIDR(self) && cidr(self).prefixLength() > 0 && string(cidr(self).masked())
                          == self
                      - message: route must not overlap unspecified loopback or multicast
                          ranges or use mapped IPv4
                        rule: isCIDR(self) && !self.startsWith('::ffff:') && ['0.0.0.0/32',
                          '127.0.0.0/8', '224.0.0.0/4', '::/128', '::1/128', 'ff00::/8'].all(r,
                          !cidr(self).containsIP(cidr(r).ip()) && !cidr(r).containsCIDR(cidr(self)))
                    maxItems: 16
                    minItems: 1
                    type: array
                    x-kubernetes-list-type: set
                  tag:
                    description: |-
                      Tag of a TailnetIngress bound to the same Tailnet (TailnetIngress.status.tag), or an ingress
                      tag a merged spoke fragment grants to. An unknown tag is never rendered (TargetUnknown).
                    maxLength: 63
                    pattern: ^tag:[a-z][a-z0-9-]*$
                    type: string
                type: object
                x-kubernetes-validations:
                - message: exactly one of tag and prefixes must be set
                  rule: has(self.tag) != has(self.prefixes)
            required:
            - action
            - duration
            - requestedAs
            - requester
            - tailnetRef
            type: object
            x-kubernetes-validations:
            - message: spec is immutable
              rule: self == oldSelf
            - message: grantName is set exactly for action Extend
              rule: (self.action == 'Extend') == has(self.grantName)
            - message: sources, target and ports are set exactly for action Create
              rule: 'self.action == ''Create'' ? (has(self.sources) && has(self.target)
                && has(self.ports)) : !(has(self.sources) || has(self.target) || has(self.ports))'
          status:
            description: |-
              TailnetAccessRequestStatus is the decision, written by the console only. It names nobody: who
              approved, rejected or withdrew is in the console's audit log.
            properties:
              decidedAt:
                format: date-time
                type: string
              grantName:
                description: The TailnetGrant created or extended on approval.
                maxLength: 253
                type: string
              phase:
                description: 'Empty while nobody decided: the request is pending.'
                enum:
                - Pending
                - Approved
                - Rejected
                - Withdrawn
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
