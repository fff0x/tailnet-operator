---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tailnetsites.tsunaro.io
spec:
  group: tsunaro.io
  names:
    kind: TailnetSite
    listKind: TailnetSiteList
    plural: tailnetsites
    shortNames:
    - tns
    singular: tailnetsite
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tailnetRef.name
      name: Tailnet
      type: string
    - jsonPath: .spec.owner
      name: Owner
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].reason
      name: Ready
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TailnetSite is a cluster-scoped remote network advertised by
          tagged subnet routers.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: |-
              TailnetSiteSpec declares a remote network (a branch, a management net, a single host as /32)
              that a tagged router advertises into the tailnet. The operator renders autoApprovers for the
              prefixes, replays approvals on the advertising nodes and reports whether the routes are
              advertised and approved. Who may *reach* the prefixes is a grant in the base policy
              or a TailnetGrant.
            properties:
              advertisedBy:
                description: |-
                  SiteAdvertiser names the subnet routers that carry a site's prefixes by tag. A router is any
                  Headscale node with one of these tags — an operator-managed TailnetGateway as well as any
                  tagged router in another cluster. Empty → Tailnet.spec.policy.routeApprovers.
                properties:
                  tags:
                    items:
                      maxLength: 63
                      pattern: ^tag:[a-z][a-z0-9-]*$
                      type: string
                    maxItems: 16
                    type: array
                    x-kubernetes-list-type: set
                type: object
              description:
                maxLength: 253
                type: string
              owner:
                description: Team or person accountable for the network; named in
                  conflict messages.
                maxLength: 63
                minLength: 1
                type: string
              prefixes:
                description: |-
                  Prefixes of the site. A /32 is a single host. Overlap with Tailnet.spec.reservedNetworks
                  or with an older TailnetSite blocks this CR (RouteConflict); nothing is rendered for it.
                items:
                  description: |-
                    GatewayPrefix is a canonical, non-default subnet route. Network ownership and
                    reachability still require runtime validation against the selected Tailnet.
                  maxLength: 49
                  type: string
                  x-kubernetes-validations:
                  - message: route must be a canonical masked non-default CIDR
                    rule: isCIDR(self) && cidr(self).prefixLength() > 0 && string(cidr(self).masked())
                      == self
                  - message: route must not overlap unspecified loopback or multicast
                      ranges or use mapped IPv4
                    rule: isCIDR(self) && !self.startsWith('::ffff:') && ['0.0.0.0/32',
                      '127.0.0.0/8', '224.0.0.0/4', '::/128', '::1/128', 'ff00::/8'].all(r,
                      !cidr(self).containsIP(cidr(r).ip()) && !cidr(r).containsCIDR(cidr(self)))
                maxItems: 64
                minItems: 1
                type: array
                x-kubernetes-list-type: set
              tailnetRef:
                description: TailnetRef selects a cluster-scoped Tailnet by name.
                properties:
                  name:
                    type: string
                required:
                - name
                type: object
            required:
            - owner
            - prefixes
            - tailnetRef
            type: object
          status:
            description: TailnetSiteStatus records what the control server reports
              for the site's prefixes.
            properties:
              conditions:
                description: 'Conditions: RouteConflict, UnmanagedOverlap, Advertised,
                  Approved, Ready.'
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              routesAdvertised:
                description: Prefixes of this site some advertiser node currently
                  offers.
                items:
                  type: string
                type: array
              routesApproved:
                description: Prefixes of this site approved on some advertiser node.
                items:
                  type: string
                type: array
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
