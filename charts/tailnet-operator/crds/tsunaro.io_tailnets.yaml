---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.22.0
  name: tailnets.tsunaro.io
spec:
  group: tsunaro.io
  names:
    kind: Tailnet
    listKind: TailnetList
    plural: tailnets
    shortNames:
    - tn
    singular: tailnet
  scope: Cluster
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.server
      name: Server
      type: string
    - jsonPath: .status.conditions[?(@.type=="ApiKeyValid")].status
      name: ApiKey
      type: string
    - jsonPath: .status.apiKeyExpiresAt
      name: Expires
      type: string
    - jsonPath: .status.conditions[?(@.type=="HeadscaleCompatible")].reason
      name: Compat
      type: string
    - jsonPath: .status.conditions[?(@.type=="PolicyApplied")].reason
      name: Policy
      type: string
    - jsonPath: .status.conditions[?(@.type=="SplitDNS")].reason
      name: DNS
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Tailnet is a cluster-scoped binding to one control server.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: TailnetSpec describes a control server and how the operator
              authenticates to it.
            properties:
              apiKeyLifetime:
                default: 720h
                description: Lifetime of the self-minted working API key. Rotated
                  at half-life.
                maxLength: 32
                type: string
                x-kubernetes-validations:
                - message: apiKeyLifetime must be a valid duration of at least 1h
                  rule: duration(self) >= duration('1h')
              apiSecretRef:
                description: |-
                  Bootstrap API key, read only. The operator mints its own rotating working key from it and
                  never writes back here — so this may live in GitOps without a rotation fight.
                properties:
                  key:
                    default: apiKey
                    type: string
                  name:
                    type: string
                required:
                - name
                type: object
              apiUrl:
                description: In-cluster URL for the REST API if it differs from Server.
                  Empty → Server.
                type: string
              authKeyLifetime:
                default: 168h
                description: Lifetime of the reusable ephemeral pre-auth keys handed
                  to agents. Rotated at half-life.
                type: string
              defaults:
                description: Defaults inherited by ingress resources that do not select
                  their own TLS source.
                properties:
                  tls:
                    description: |-
                      TLSDefaults supplies an issuer for HTTP ingresses without an explicit TLS source.
                      Secrets are namespace-local and cannot be selected as a Tailnet-wide default.
                    properties:
                      issuerRef:
                        description: |-
                          TLSIssuerReference identifies a cert-manager issuer without requiring its API dependency.
                          Issuer references resolve in the ingress namespace; ClusterIssuer references are cluster-scoped.
                        properties:
                          group:
                            default: cert-manager.io
                            description: Only cert-manager.io issuers are supported.
                            enum:
                            - cert-manager.io
                            type: string
                          kind:
                            default: Issuer
                            enum:
                            - Issuer
                            - ClusterIssuer
                            type: string
                          name:
                            description: Name of the issuer.
                            maxLength: 253
                            minLength: 1
                            pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                            type: string
                        required:
                        - name
                        type: object
                    type: object
                type: object
              dns:
                description: DNS records rendered from egress aliases and ingress
                  names. Off when empty.
                properties:
                  hostsConfigMap:
                    description: |-
                      Name of the ConfigMap (operator namespace, key "hosts") that receives the rendered hosts file.
                      Empty → the feature is off and a previously rendered ConfigMap is removed.
                    type: string
                  ingressNameTemplate:
                    description: |-
                      Template for a TailnetIngress's DNS name; {name} is the CR name, {namespace} its namespace.
                      Keep the result one label below your gateway's wildcard certificate, e.g.
                      "{name}-{namespace}.prod-1.tailnet.example.internal". Empty → ingresses get no name.
                    maxLength: 253
                    type: string
                    x-kubernetes-validations:
                    - message: ingressNameTemplate must contain {name} and end in
                        a literal lowercase DNS zone with at least two labels
                      rule: self == '' || (self.contains('{name}') && self.replace('{name}',
                        'n').replace('{namespace}', 'ns').matches('^[a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?([.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?)*$')
                        && self.matches('[.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?[.][a-z0-9]([-a-z0-9]{0,61}[a-z0-9])?$'))
                type: object
              headscale:
                description: External Headscale metadata; compatibility is checked
                  against the API, not the version hint.
                properties:
                  ref:
                    description: Reserved for an operator-managed Headscale. Must
                      remain empty until managed mode is supported.
                    type: string
                    x-kubernetes-validations:
                    - message: headscale.ref is reserved; managed Headscale is not
                        supported yet
                      rule: self == ''
                  version:
                    description: Optional version hint for diagnostics, e.g. "0.29.3".
                      Does not bypass capability checks.
                    type: string
                type: object
              hostnameTemplate:
                default: egress-{name}
                description: Template for a TailnetEgress's tailnet hostname when
                  it sets none. {name} is the CR name.
                type: string
              ingressHostnameTemplate:
                default: ingress-{name}
                description: Template for a TailnetIngress's tailnet (MagicDNS) hostname
                  when it sets none. {name} is the CR name.
                type: string
              ingressTagTemplate:
                default: tag:ingress-{name}
                description: |-
                  Template for a TailnetIngress's tag when it sets none. {name} is the CR name.
                  The tag IS the authorization — its grants (dst = this tag) decide which peers may reach it.
                type: string
              policy:
                description: Policy generation from CRs. Off when baseConfigMap is
                  empty.
                properties:
                  baseConfigMap:
                    description: |-
                      ConfigMap (operator namespace, key "policy") holding the base policy in HuJSON.
                      Empty → the feature is off and nothing is rendered or written.
                    type: string
                  ingressSourceAllowlist:
                    description: |-
                      Glob patterns a TailnetIngress.spec.allowFrom entry must match, e.g. ["group:*"]. Ingress CRs
                      live in tenant namespaces, so this is the admin's veto over who tenants may grant access to.
                      Empty → no ingress grants are generated (only the tag is declared).
                    items:
                      maxLength: 253
                      pattern: ^((group:|tag:|autogroup:)[^[:space:]]+|[^@[:space:]]+@[^@[:space:]]+)$
                      type: string
                    type: array
                  mode:
                    default: DryRun
                    description: |-
                      DryRun renders into renderedConfigMap only; Apply also writes the control server when the
                      live policy differs. Start with DryRun, compare, then switch.
                    enum:
                    - DryRun
                    - Apply
                    type: string
                  renderedConfigMap:
                    description: |-
                      ConfigMap (operator namespace, key "policy") that receives the rendered policy for review.
                      Empty → "<baseConfigMap>-rendered".
                    type: string
                  routeApprovers:
                    description: |-
                      Approvers for the generated autoApprovers.routes entries (one /32 per egress target), i.e.
                      the tag your subnet routers carry, e.g. ["tag:fabric"]. Required when on.
                    items:
                      type: string
                    type: array
                  tagOwners:
                    description: Owners of the generated tags (tagOwners value), e.g.
                      ["group:operator"]. Required when on.
                    items:
                      type: string
                    type: array
                type: object
                x-kubernetes-validations:
                - message: policy.tagOwners and policy.routeApprovers are required
                    when baseConfigMap is set
                  rule: '!has(self.baseConfigMap) || size(self.baseConfigMap) == 0
                    || (has(self.tagOwners) && size(self.tagOwners) > 0 && has(self.routeApprovers)
                    && size(self.routeApprovers) > 0)'
              proxy:
                description: |-
                  ProxySpec are the defaults for the per-CR agent pods this Tailnet spawns. A TailnetEgress may
                  override image and resources.
                properties:
                  image:
                    description: |-
                      Container image carrying the tailnet-agent binary. Empty → the operator's own image, so a
                      single pushed image serves both control and data plane.
                    type: string
                  imagePullSecrets:
                    description: |-
                      Names of existing image-pull Secrets in each agent pod's namespace. Omitted inherits
                      the operator defaults; an explicit empty list disables those defaults. Duplicate names
                      are collapsed when building pods because Kubernetes merges these references by name.
                    items:
                      maxLength: 253
                      minLength: 1
                      pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$
                      type: string
                    type: array
                  mtu:
                    default: 1200
                    description: tsnet outer path MTU. 1200 leaves headroom for a
                      ~1320-byte outer path (typical cloud CNI overlay).
                    format: int32
                    maximum: 1500
                    minimum: 576
                    type: integer
                  probeInterval:
                    default: 5m
                    description: How often the agent probes each target for reachability.
                      "0s" disables probing.
                    type: string
                  resources:
                    description: ResourceRequirements describes the compute resource
                      requirements.
                    properties:
                      claims:
                        description: |-
                          Claims lists the names of resources, defined in spec.resourceClaims,
                          that are used by this container.

                          This field depends on the
                          DynamicResourceAllocation feature gate.

                          This field is immutable. It can only be set for containers.
                        items:
                          description: ResourceClaim references one entry in PodSpec.ResourceClaims.
                          properties:
                            name:
                              description: |-
                                Name must match the name of one entry in pod.spec.resourceClaims of
                                the Pod where this field is used. It makes that resource available
                                inside a container.
                              type: string
                            request:
                              description: |-
                                Request is the name chosen for a request in the referenced claim.
                                If empty, everything from the claim is made available, otherwise
                                only the result of this request.
                              type: string
                          required:
                          - name
                          type: object
                        type: array
                        x-kubernetes-list-map-keys:
                        - name
                        x-kubernetes-list-type: map
                      limits:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Limits describes the maximum amount of compute resources allowed.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                      requests:
                        additionalProperties:
                          anyOf:
                          - type: integer
                          - type: string
                          pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                          x-kubernetes-int-or-string: true
                        description: |-
                          Requests describes the minimum amount of compute resources required.
                          If Requests is omitted for a container, it defaults to Limits if that is explicitly specified,
                          otherwise to an implementation-defined value. Requests cannot exceed Limits.
                          More info: https://kubernetes.io/docs/concepts/configuration/manage-resources-containers/
                        type: object
                    type: object
                type: object
              server:
                description: Login/control URL, becomes the agent's ControlURL (e.g.
                  https://ts.example.com).
                minLength: 9
                pattern: ^https://
                type: string
              tagTemplate:
                default: tag:egress-{name}
                description: |-
                  Template for a TailnetEgress's tag when it sets none. {name} is the CR name.
                  The tag IS the authorization — its grants decide which routes the node sees.
                type: string
            required:
            - apiSecretRef
            - server
            type: object
          status:
            description: TailnetStatus is the observed state of the control server
              binding.
            properties:
              apiKeyExpiresAt:
                description: Expiry of the current working API key, drives the ApiKeyValid
                  condition and its metric.
                format: date-time
                type: string
              conditions:
                description: |-
                  Conditions: ApiReachable, ApiKeyValid, HeadscaleCompatible, PolicyMode, SplitDNS,
                  PolicyRendered, PolicyApplied.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              observedGeneration:
                format: int64
                type: integer
              policy:
                description: Policy rendering/apply state; conditions PolicyRendered
                  and PolicyApplied carry the reasons.
                properties:
                  appliedAt:
                    format: date-time
                    type: string
                  appliedHash:
                    description: sha256 of the policy last written to (or found identical
                      on) the control server.
                    type: string
                  generated:
                    description: PolicyGenerated counts what the operator added to
                      the base policy.
                    properties:
                      grants:
                        type: integer
                      routes:
                        type: integer
                      tags:
                        type: integer
                    required:
                    - grants
                    - routes
                    - tags
                    type: object
                  renderedHash:
                    description: sha256 of the canonical rendered policy.
                    type: string
                type: object
              version:
                description: Reported control-server version, for the operator log
                  and the printcolumn.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
