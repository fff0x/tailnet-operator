- name: tailnet-operator
  rules:
    - alert: TailnetOperatorDown
      expr: absent(up{namespace="{{ include "tailnet-operator.namespace" . }}",service="{{ include "tailnet-operator.name" . }}-metrics"}) or max(up{namespace="{{ include "tailnet-operator.namespace" . }}",service="{{ include "tailnet-operator.name" . }}-metrics"}) == 0
      for: 5m
      labels:
        severity: critical
      annotations:
        summary: No tailnet operator metrics endpoint is healthy
        description: Check the operator pods, ServiceMonitor selection and scraper network access. Missing discovery also triggers this alert.
        runbook_url: docs/OPERATIONS.md#monitoring-operator-down
    - alert: TailnetReconcileErrors
      expr: sum by (controller) (rate(controller_runtime_reconcile_errors_total{namespace="{{ include "tailnet-operator.namespace" . }}",service="{{ include "tailnet-operator.name" . }}-metrics"}[5m])) > 0.1
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Tailnet controller reconciliation is failing
        description: Reconciliation errors exceed 0.1 per second for ten minutes. Inspect controller logs and the affected custom resource conditions.
        runbook_url: docs/OPERATIONS.md#monitoring-reconcile-errors
    - alert: TailnetHeadscaleAPIErrors
      expr: sum by (tailnet) (rate(tailnet_headscale_api_requests_total{code=~"5.."}[10m])) / sum by (tailnet) (rate(tailnet_headscale_api_requests_total[10m])) > 0.05
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Headscale API server errors exceed five percent
        description: More than five percent of observed operations returned HTTP 5xx over ten minutes. Code 0 denotes transport failure, not HTTP 5xx.
        runbook_url: docs/OPERATIONS.md#monitoring-headscale-api
    - alert: TailnetResourceNotReady
      expr: max by (kind, namespace, name, tailnet, reason) ((tailnet_resource_ready == 0) * on (job, instance, kind, namespace, name) group_left(reason) (tailnet_resource_condition{type="Ready"} == 1))
      for: 10m
      labels:
        severity: warning
      annotations:
        summary: Tailnet resource remains not ready
        description: The reason label is the current Ready reason, not a historical reason. Resources without a Ready condition, including Tailnet, are not evaluated.
        runbook_url: docs/OPERATIONS.md#monitoring-resource-not-ready
    - alert: TailnetPolicyStale
      expr: max by (tailnet) (tailnet_policy_pending) == 1
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: Rendered policy has not been applied
        description: Apply mode has a nonempty rendered hash different from the applied hash for fifteen minutes. A stable InSync policy is healthy regardless of its applied timestamp age.
        runbook_url: docs/OPERATIONS.md#monitoring-policy-stale
    - alert: TailnetPolicyRejected
      expr: max by (kind, namespace, name, reason) (tailnet_resource_condition{kind="Tailnet",type="PolicyApplied",reason="PolicyRejected"}) == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Headscale rejected a rendered policy
        description: Inspect PolicyApplied and the rendered policy ConfigMap. The previous live policy remains active after rejection.
        runbook_url: docs/OPERATIONS.md#monitoring-policy-rejected
    - alert: TailnetPolicyApplyErrors
      expr: sum by (tailnet) (increase(tailnet_policy_apply_errors_total[30m])) >= 6
      labels:
        severity: warning
      annotations:
        summary: Repeated policy application failures
        description: At least six policy writes failed in thirty minutes. Inspect API connectivity and policy validation errors.
        runbook_url: docs/OPERATIONS.md#monitoring-policy-apply-errors
    - alert: TailnetPolicyGeneratedDrop
      expr: max by (tailnet, kind) (tailnet_policy_generated) < 0.5 * max by (tailnet, kind) (max_over_time(tailnet_policy_generated[10m]))
      labels:
        severity: warning
      annotations:
        summary: Generated policy entries dropped by more than half
        description: Compare tags, grants and routes with intended resource deletions and selectors. This alert also detects legitimate large removals and requires review.
        runbook_url: docs/OPERATIONS.md#monitoring-policy-generated-drop
    - alert: TailnetApprovalReplays
      expr: sum by (tailnet) (increase(tailnet_route_approvals_replayed_total[1h])) > 3
      labels:
        severity: warning
      annotations:
        summary: Route approvals are being replayed repeatedly
        description: More than three routes were successfully approved by replay in one hour. This counts routes, not API requests; inspect Headscale restarts and route stability.
        runbook_url: docs/OPERATIONS.md#monitoring-route-replays
    - alert: TailnetRouteConflict
      expr: max by (name, tailnet, reason) ((tailnet_resource_condition{kind="TailnetSite",type="RouteConflict",reason!="None"} == 1) * on (job, instance, kind, namespace, name) group_left(tailnet) tailnet_resource_ready{kind="TailnetSite"})
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: TailnetSite blocked by a route conflict
        description: The site overlaps a reserved network or an older site (reason label) and nothing is rendered or approved for it. Resolve the overlap in the CRs; the operator never de-approves routes.
        runbook_url: docs/OPERATIONS.md#monitoring-route-conflict
    - alert: TailnetUnmanagedRouteOverlap
      expr: max by (name, tailnet) ((tailnet_resource_condition{kind="TailnetSite",type="UnmanagedOverlap",reason="Unmanaged"} == 1) * on (job, instance, kind, namespace, name) group_left(tailnet) tailnet_resource_ready{kind="TailnetSite"})
      for: 30m
      labels:
        severity: info
      annotations:
        summary: A node without an advertiser tag advertises a route overlapping a TailnetSite
        description: Report only; the managed route still ships and clients pick the longest prefix. The condition message names the node.
        runbook_url: docs/OPERATIONS.md#monitoring-unmanaged-route-overlap
    - alert: TailnetGatewayFreshBlocked
      expr: max by (name, tailnet) ((tailnet_resource_condition{kind="TailnetGateway",type="Ready",reason="FreshBlocked"} == 1) * on (job, instance, kind, namespace, name) group_left(tailnet) tailnet_resource_ready{kind="TailnetGateway"})
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: TailnetGateway bootstrap is blocked
        description: The fresh writer refuses to continue (expired or drifted bootstrap key, unverified provenance, template drift) and nothing is written. Read the Ready message; the zone stays frozen until the cause is reverted.
        runbook_url: docs/OPERATIONS.md#monitoring-gateway-fresh-blocked
    - alert: TailnetNodeOffline
      expr: min by (kind, namespace, name) (tailnet_node_online) == 0
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: No matching Headscale node is online
        description: A successful node listing found no matching online node for five minutes. An absent series means no current observation, not an offline node.
        runbook_url: docs/OPERATIONS.md#monitoring-node-offline
    - alert: TailnetAPIKeyExpiringSoon
      expr: tailnet_apikey_expires_seconds < {{ .Values.monitoring.rules.apiKeyExpiryWarningSeconds }}
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Working Headscale API key is nearing expiry
        description: Less than {{ .Values.monitoring.rules.apiKeyExpiryWarningSeconds }} seconds remain. Check automatic rotation and the bootstrap credential. Negative values mean the key has already expired.
        runbook_url: docs/OPERATIONS.md#monitoring-key-expiry
    - alert: TailnetEgressAuthKeyExpiringSoon
      expr: tailnetegress_authkey_expires_seconds < {{ .Values.monitoring.rules.authKeyExpiryWarningSeconds }}
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Egress pre-auth key is nearing expiry
        description: Less than {{ .Values.monitoring.rules.authKeyExpiryWarningSeconds }} seconds remain. Check key rotation before an agent needs to register again. Key expiry alone does not prove an existing node is offline.
        runbook_url: docs/OPERATIONS.md#monitoring-key-expiry
    - alert: TailnetIngressAuthKeyExpiringSoon
      expr: tailnetingress_authkey_expires_seconds < {{ .Values.monitoring.rules.authKeyExpiryWarningSeconds }}
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: Ingress pre-auth key is nearing expiry
        description: Less than {{ .Values.monitoring.rules.authKeyExpiryWarningSeconds }} seconds remain. Check key rotation before an agent needs to register again. Key expiry alone does not prove an existing node is offline.
        runbook_url: docs/OPERATIONS.md#monitoring-key-expiry
    - alert: TailnetSpokeUnreachable
      expr: max by (tailnet, spoke) (tailnet_spoke_reachable) == 0
      for: 1h
      labels:
        severity: warning
      annotations:
        summary: A spoke's policy fragment could not be fetched
        description: The hub has failed to read the spoke's fragment ConfigMap for an hour (condition SpokeReachable names the cause - kubeconfig, RBAC or network). The last approved fragment stays merged; the spoke's newer grants are not.
        runbook_url: docs/OPERATIONS.md#monitoring-spoke-unreachable
    - alert: TailnetSpokeFragmentInvalid
      expr: max by (tailnet, spoke) (tailnet_spoke_fragment_valid) == 0
      for: 15m
      labels:
        severity: warning
      annotations:
        summary: A spoke's fetched fragment breaks the hub's limits
        description: The fetched fragment has failed validation for fifteen minutes (condition SpokeFragmentValid names the path). The last approved fragment stays merged.
        runbook_url: docs/OPERATIONS.md#monitoring-spoke-fragment-invalid
    - alert: TailnetSpokeApprovalPending
      expr: max by (tailnet, spoke) (tailnet_spoke_fragment_pending) == 1
      for: 4h
      labels:
        severity: info
      annotations:
        summary: A spoke fragment has waited for approval for four hours
        description: Approval mode Manual holds a valid fetched fragment until the Tailnet carries tsunaro.io/approve-spoke.<spoke> with the pending hash. Review the <spoke>-policy-fragment-pending ConfigMap and status.spokes[].pendingDelta.
        runbook_url: docs/OPERATIONS.md#monitoring-spoke-approval-pending
