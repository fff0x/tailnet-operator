# Used only by the owned, layered-isolation fixture, not an existing cluster.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  apiServerAddress: "127.0.0.1"
nodes:
  - role: control-plane
    image: kindest/node:v1.36.1@sha256:3489c7674813ba5d8b1a9977baea8a6e553784dab7b84759d1014dbd78f7ebd5
# Preserve the isolated node's lack of a default route. Resolve admission
# Services to endpoints while retaining Service DNS/SNI and CA verification.
kubeadmConfigPatches:
  - |
    kind: ClusterConfiguration
    apiServer:
      extraArgs:
        - name: enable-aggregator-routing
          value: "true"
  # Let the gateway kernel-prerequisite fixture pod request net.ipv4.ip_forward via
  # securityContext.sysctls — the test-environment equivalent of the Talos node's
  # enabled forwarding that the real gateway pod inherits. This only PERMITS the
  # namespaced unsafe sysctl; pods that do not request it are unaffected, and the
  # HTTP/L4 fixtures set no sysctls. No host sysctl is changed.
  - |
    kind: KubeletConfiguration
    allowedUnsafeSysctls:
      - "net.ipv4.ip_forward"
